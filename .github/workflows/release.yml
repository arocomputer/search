name: Release

# A vX.Y.Z tag on main builds and checks each supported platform natively,
# publishes checksummed/attested archives, then verifies installation.
# scripts/release.sh makes the tag after the full CI matrix has passed.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to publish, such as v0.2.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  tag:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ secrets.RELEASE_TOKEN }}
          fetch-depth: 0
      - name: Validate release and push its tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          test "$GITHUB_REF" = refs/heads/main || { echo 'Run releases from main.' >&2; exit 1; }
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid release tag: $TAG" >&2; exit 1; }
          grep -q "^## $TAG " CHANGELOG.md || { echo "CHANGELOG.md has no ## $TAG section" >&2; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists" >&2
            exit 1
          fi
          commit=$(git rev-parse HEAD)
          result=$(gh run list --workflow ci.yml --branch main --event push --commit "$commit" --json status,conclusion -q '.[0] | "\(.status) \(.conclusion)"')
          [ "$result" = 'completed success' ] || { echo "CI on main ($commit) is '$result'; wait for it to pass." >&2; exit 1; }
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

  check:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The tag is on main and has notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$TAG is not on main" >&2; exit 1; }
          grep -q "^## $TAG " CHANGELOG.md || { echo "CHANGELOG.md has no ## $TAG section" >&2; exit 1; }

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            arch: amd64
            triple: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            triple: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            platform: darwin
            arch: amd64
            triple: x86_64-apple-darwin
          - os: macos-latest
            platform: darwin
            arch: arm64
            triple: aarch64-apple-darwin
          - os: windows-latest
            platform: windows
            arch: amd64
            triple: x86_64-pc-windows-msvc
          - os: windows-11-arm
            platform: windows
            arch: arm64
            triple: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: 1.98.0-${{ matrix.triple }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # stable
        with:
          toolchain: 1.98.0-${{ matrix.triple }}
          targets: ${{ matrix.triple }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          architecture: ${{ startsWith(matrix.triple, 'aarch64') && 'arm64' || 'x64' }}
      - name: Verify native Rust host
        env:
          TRIPLE: ${{ matrix.triple }}
        run: |
          test "$(rustc -vV | sed -n 's/^host: //p' | tr -d '\r')" = "$TRIPLE"
      - name: Select a user-owned Windows test temp directory
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $temp = Join-Path $env:LOCALAPPDATA 'Temp'
          New-Item -ItemType Directory -Path $temp -Force | Out-Null
          "SEARCH_TEST_TEMP=$temp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: ./x check
        env:
          TMPDIR: ${{ env.SEARCH_TEST_TEMP || runner.temp }}
          TMP: ${{ env.SEARCH_TEST_TEMP || runner.temp }}
          TEMP: ${{ env.SEARCH_TEST_TEMP || runner.temp }}
      - name: Build native release binary
        env:
          TAG: ${{ github.ref_name }}
          TRIPLE: ${{ matrix.triple }}
          MACOSX_DEPLOYMENT_TARGET: '11.0'
          RUSTFLAGS: ${{ matrix.platform == 'windows' && '-C target-feature=+crt-static' || '' }}
        run: |
          SEARCH_BUILD_VERSION="$TAG" SEARCH_BUILD_CHANNEL=release SEARCH_BUILD_COMMIT="$GITHUB_SHA" \
            ./x build --release --target "$TRIPLE" --bin search
      - name: Verify the Windows release needs no C runtime redistributable
        if: runner.os == 'Windows'
        env:
          TRIPLE: ${{ matrix.triple }}
        run: python scripts/check-windows-imports.py "target/$TRIPLE/release/search.exe"
      - name: Package Unix archive
        if: runner.os != 'Windows'
        env:
          TAG: ${{ github.ref_name }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
          TRIPLE: ${{ matrix.triple }}
        run: |
          mkdir -p dist/package
          cp "target/$TRIPLE/release/search" LICENSE dist/package/
          tar -C dist/package -czf "dist/search_${TAG}_${PLATFORM}_${ARCH}.tar.gz" search LICENSE
          rm -r dist/package
      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
          TRIPLE: ${{ matrix.triple }}
        run: |
          New-Item -ItemType Directory -Path dist/package -Force | Out-Null
          Copy-Item "target/$env:TRIPLE/release/search.exe", LICENSE dist/package/
          Compress-Archive -Path dist/package/search.exe, dist/package/LICENSE -DestinationPath "dist/search_$($env:TAG)_windows_$($env:ARCH).zip"
          Remove-Item dist/package -Recurse
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: search-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: search-*
          path: dist
          merge-multiple: true
      - name: Check archive set and generate checksums
        env:
          TAG: ${{ github.ref_name }}
        run: |
          for platform in linux darwin windows; do
            for arch in amd64 arm64; do
              extension=tar.gz
              [ "$platform" != windows ] || extension=zip
              test -f "dist/search_${TAG}_${platform}_${arch}.${extension}"
            done
          done
          (cd dist && sha256sum -- *.tar.gz *.zip > checksums.txt)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          awk -v tag="$TAG" '/^## /{on = index($0, "## " tag " ") == 1; next} on' CHANGELOG.md > notes.md
          test -s notes.md
          gh release create "$TAG" dist/*.tar.gz dist/*.zip dist/checksums.txt --verify-tag --title "$TAG" --notes-file notes.md

  # This job updates the Homebrew formula in main with the org release token.
  formula:
    needs: release
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ secrets.RELEASE_TOKEN }}
      - name: Point the Homebrew formula at the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p checksums.txt -O "$RUNNER_TEMP/checksums.txt"
          scripts/formula.sh "$TAG" "$RUNNER_TEMP/checksums.txt" > search.rb
          git add search.rb
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "release: $TAG"
          git push origin HEAD:main

  install:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Unix release
        if: runner.os != 'Windows'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          sh install.sh --version "$TAG" --dir "$RUNNER_TEMP/search-bin"
          test "$("$RUNNER_TEMP/search-bin/search" version)" = "$TAG"
          export SEARCH_HOME="$RUNNER_TEMP/search-home"
          "$RUNNER_TEMP/search-bin/search" engines list
          "$RUNNER_TEMP/search-bin/search" configure searxng url https://searx.example/search
          "$RUNNER_TEMP/search-bin/search" engines list
      - name: Install the Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          ./install.ps1 -Version $env:TAG -Dir "$env:RUNNER_TEMP/search-bin"
          if ((& "$env:RUNNER_TEMP/search-bin/search.exe" version) -ne $env:TAG) { throw 'Installed version mismatch' }
          $env:SEARCH_HOME = Join-Path $env:LOCALAPPDATA ('Search-install-smoke-' + [Guid]::NewGuid())
          & "$env:RUNNER_TEMP/search-bin/search.exe" engines list
          if ($LASTEXITCODE -ne 0) { throw 'Engine listing failed' }
          & "$env:RUNNER_TEMP/search-bin/search.exe" configure searxng url https://searx.example/search
          if ($LASTEXITCODE -ne 0) { throw 'Engine configuration failed' }
          & "$env:RUNNER_TEMP/search-bin/search.exe" engines list
          if ($LASTEXITCODE -ne 0) { throw 'Package listing failed' }
