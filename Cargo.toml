# One package: a protocol-free core with settings-defined engines, plus optional frontends.
[package]
name = "search"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "MIT"
homepage = "https://github.com/fschrhunt/search"
repository = "https://github.com/fschrhunt/search"
description = "Self-hosted live web search and guarded page fetching"
publish = false

[lib]
name = "search"
path = "src/lib.rs"

[[bin]]
name = "search"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["mcp", "dep:axum", "dep:axum-server", "dep:rcgen", "dep:subtle", "dep:fs2", "tokio/net", "tokio/signal"]
mcp = ["dep:rmcp", "tokio/io-std"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "process"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip"] }
dom_smoothie = "0.18"
dom_query = "0.28"
encoding_rs = "0.8"
pdf-extract = "0.12"
url = "2"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.11"
libc = "0.2"
rustls-pemfile = "2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rmcp = { version = "3", default-features = false, features = ["server", "macros", "transport-io", "transport-streamable-http-server"], optional = true }
axum = { version = "0.8", optional = true }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"], optional = true }
rcgen = { version = "0.14", optional = true }
subtle = { version = "2", optional = true }
fs2 = { version = "0.4", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_WindowsProgramming"] }

[dev-dependencies]
tokio = { version = "1", features = ["net"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_IO", "Win32_System_Ioctl", "Win32_System_SystemServices"] }

[[test]]
name = "cli_fetch"
path = "tests/cli/fetch.rs"
required-features = ["cli"]

[[test]]
name = "cli_engines"
path = "tests/cli/engines.rs"
required-features = ["cli"]

[[test]]
name = "cli_remote"
path = "tests/cli/remote.rs"
required-features = ["cli"]

[[test]]
name = "engines_parsers"
path = "tests/engines/parsers.rs"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
